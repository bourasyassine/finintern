# Configuration pour l'environnement de développement avec Docker Oracle
spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:ORCLCDB
    driver-class-name: oracle.jdbc.OracleDriver
    username: leaveapp_user
    password: leaveapp_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

logging:
  level:
    com.leaveapp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG 