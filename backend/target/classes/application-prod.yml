# Configuration pour l'environnement de production
spring:
  datasource:
    url: jdbc:oracle:thin:@your-oracle-server:1521:YOUR_SID
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:leaveapp_user}
    password: ${DB_PASSWORD:leaveapp_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.OracleDialect

logging:
  level:
    com.leaveapp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN 